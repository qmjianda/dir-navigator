name: verify

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  static-check:
    name: 静态自检
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Node 版本
        run: node --version

      - name: 运行 tools/verify.js
        run: node tools/verify.js
