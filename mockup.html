<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>目录导航器 · 视觉稿</title>
<style>
  /* ===== 设计令牌（冷中性色，全部带蓝偏，杜绝纯灰） ===== */
  :root{
    /* 表面 */
    --surface:#fbfcfe;          /* 窗口主表面，微蓝白 */
    --surface-2:#f3f5f8;        /* 侧栏/列头 */
    --surface-3:#e9edf2;        /* hover */
    --surface-4:#dfe8f4;        /* selected 柔和底 */
    /* 描边 */
    --border:#e2e7ee;
    --border-strong:#c9d2dd;
    /* 文字 */
    --text:#1b2532;
    --text-2:#46536a;
    --text-3:#7b879a;
    /* 强调色（Win11 蓝，10% 用量） */
    --accent:#0067c0;
    --accent-hover:#005cb0;
    --accent-soft:#e3f0fc;
    /* 文件夹黄 */
    --folder-front:#ffd76e;
    --folder-back:#ffc238;
    /* 尺寸 */
    --r-sm:4px; --r-md:6px; --r-lg:8px;
    --shadow-window:0 1px 2px rgba(16,24,40,.06), 0 12px 40px rgba(16,24,40,.12);
    --shadow-pop:0 4px 16px rgba(16,24,40,.12);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"Segoe UI Variable","Segoe UI","Microsoft YaHei UI","Microsoft YaHei",system-ui,sans-serif;
    color:var(--text);
    /* Mica 近似：低饱和冷灰蓝，轻微纵向渐变，无饱和色 */
    background:
      radial-gradient(1000px 500px at 50% -20%, rgba(120,150,190,.10), transparent 60%),
      linear-gradient(180deg, #f0f3f7 0%, #e9edf2 100%);
    display:flex;flex-direction:column;align-items:center;
    padding:30px 20px 16px;
    text-rendering:optimizeLegibility;
    -webkit-font-smoothing:antialiased;
  }

  /* ===== 演示控制条（圆角矩形，非胶囊） ===== */
  .demo-bar{
    display:flex;gap:6px;align-items:center;margin-bottom:14px;
    background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);
    padding:5px 6px;box-shadow:0 1px 3px rgba(16,24,40,.05);
  }
  .demo-bar .lbl{font-size:11.5px;color:var(--text-3);padding:0 8px;letter-spacing:.03em}
  .demo-bar button{
    font:inherit;font-size:12.5px;color:var(--text-2);background:transparent;
    border:1px solid transparent;border-radius:var(--r-sm);padding:5px 12px;cursor:pointer;
    transition:background .12s,color .12s;
  }
  .demo-bar button:hover{background:var(--surface-3)}
  .demo-bar button.active{background:var(--surface-4);color:var(--accent)}
  .demo-bar .sep{width:1px;height:16px;background:var(--border);margin:0 3px}

  /* ===== 应用窗口 ===== */
  .window{
    width:1000px;max-width:100%;height:636px;
    background:var(--surface);
    border:1px solid var(--border-strong);
    border-radius:var(--r-lg);
    box-shadow:var(--shadow-window);
    display:flex;flex-direction:column;overflow:hidden;position:relative;
  }
  .titlebar{
    height:42px;display:flex;align-items:center;gap:10px;padding:0 12px;
    border-bottom:1px solid var(--border);flex:0 0 42px;
    background:linear-gradient(180deg, rgba(255,255,255,.55), rgba(255,255,255,0));
  }
  .app-logo{width:20px;height:20px;color:var(--accent);flex:0 0 auto}
  .app-name{font-size:12.5px;font-weight:600;color:var(--text);white-space:nowrap;letter-spacing:.01em}
  .search{
    flex:1;max-width:400px;height:28px;display:flex;align-items:center;gap:7px;
    background:#fff;border:1px solid var(--border);border-radius:var(--r-md);
    padding:0 8px;margin-left:4px;color:var(--text-3);
  }
  .search:focus-within{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
  .search .s-ic{width:14px;height:14px;flex:0 0 auto}
  .search input{flex:1;border:0;outline:0;font:inherit;font-size:12.5px;color:var(--text);background:transparent}
  .search .kbd{
    font-size:10px;color:var(--text-3);border:1px solid var(--border);border-radius:3px;
    padding:1px 5px;background:var(--surface-2);
  }
  .btn{
    font:inherit;font-size:12.5px;color:var(--text-2);background:#fff;
    border:1px solid var(--border);border-radius:var(--r-md);padding:5px 12px;
    cursor:pointer;white-space:nowrap;transition:background .12s,border-color .12s;
  }
  .btn:hover{background:var(--surface-3);border-color:var(--border-strong)}
  .btn:active{background:var(--surface-4)}
  .btn.primary{color:#fff;background:var(--accent);border-color:var(--accent)}
  .btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
  .win-ctrl{display:flex;gap:2px;margin-left:auto}
  .win-ctrl button{
    width:30px;height:24px;display:flex;align-items:center;justify-content:center;
    border:0;background:transparent;border-radius:var(--r-sm);color:var(--text-3);
    cursor:pointer;padding:0;transition:background .12s;
  }
  .win-ctrl button:hover{background:var(--surface-3)}
  .win-ctrl button.close:hover{background:#e81123;color:#fff}
  .win-ctrl .wc{width:11px;height:11px}

  /* ===== 主体 ===== */
  .body{flex:1;display:flex;min-height:0}

  .sidebar{flex:0 0 200px;background:var(--surface-2);border-right:1px solid var(--border);
    display:flex;flex-direction:column;min-height:0}
  .sidebar .head{
    display:flex;align-items:center;justify-content:space-between;
    padding:11px 12px 7px;font-size:11px;font-weight:600;color:var(--text-3);
    letter-spacing:.06em;
  }
  .sidebar .head .add{
    width:22px;height:22px;display:flex;align-items:center;justify-content:center;
    border:0;background:transparent;border-radius:var(--r-sm);cursor:pointer;
    color:var(--accent);padding:0;transition:background .12s;
  }
  .sidebar .head .add:hover{background:var(--surface-4)}
  .sidebar .head .add svg{width:14px;height:14px}
  .bm-list{flex:1;overflow-y:auto;padding:3px 7px 7px}
  .bm{
    display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:var(--r-md);
    cursor:pointer;font-size:13px;color:var(--text);transition:background .1s;margin-bottom:1px;
  }
  .bm:hover{background:var(--surface-3)}
  .bm.active{background:var(--surface-4);color:var(--accent-hover)}
  .bm .dot{width:8px;height:8px;border-radius:2px;flex:0 0 8px}  /* 圆角方块，非圆点 */
  .bm .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bm .pin{width:12px;height:12px;color:var(--text-3);flex:0 0 auto}
  .sidebar .foot{border-top:1px solid var(--border);padding:8px 12px}
  .sidebar .foot .count{font-size:11px;color:var(--text-3)}

  .main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--surface)}

  /* 面包屑 */
  .breadcrumb{
    display:flex;align-items:center;gap:1px;padding:7px 12px;
    border-bottom:1px solid var(--border);overflow-x:auto;white-space:nowrap;
    flex:0 0 auto;scrollbar-width:thin;
  }
  .crumb{
    display:inline-flex;align-items:center;gap:5px;padding:3px 7px;border-radius:var(--r-sm);
    font-size:12.5px;color:var(--text-2);cursor:pointer;transition:background .1s,color .1s;flex:0 0 auto;
  }
  .crumb:hover{background:var(--surface-3);color:var(--text)}
  .crumb.current{color:var(--text);font-weight:600}
  .crumb.anchor{color:var(--accent)}
  .crumb .c-ic{width:13px;height:13px;color:var(--text-3)}
  .crumb.sep{color:var(--text-3);padding:0;cursor:default;display:inline-flex}
  .crumb.sep svg{width:13px;height:13px}
  .crumb.sep:hover{background:transparent}

  /* Miller 列 */
  .columns{flex:1;display:flex;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;position:relative}
  .col{flex:0 0 212px;border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
  .col .col-head{
    padding:7px 11px;font-size:11px;font-weight:600;color:var(--text-3);letter-spacing:.04em;
    border-bottom:1px solid var(--border);display:flex;align-items:center;gap:6px;
    background:var(--surface-2);flex:0 0 auto;text-transform:uppercase;
  }
  .col .col-head .ch-ic{width:14px;height:14px}
  .col .items{flex:1;overflow-y:auto;padding:4px 5px}
  .item{
    display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:var(--r-md);
    cursor:pointer;font-size:13px;color:var(--text);transition:background .08s;
  }
  .item:hover{background:var(--surface-3)}
  .item.selected{background:var(--surface-4)}
  .item:focus-visible{outline:2px solid var(--accent);outline-offset:-1px}
  .item .f-ic{width:17px;height:17px;flex:0 0 auto}
  .item .f-ic.file{color:var(--text-3)}
  .item .f-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .item.file .f-name{color:var(--text-2)}
  .item .chev{width:14px;height:14px;color:var(--text-3);flex:0 0 auto;opacity:.65}

  .fade-right{
    position:absolute;right:0;top:0;bottom:0;width:24px;pointer-events:none;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,.85));
  }

  /* 空状态 */
  .empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--text-3)}
  .empty .big{width:44px;height:44px;color:var(--text-3)}
  .empty .t1{font-size:15px;font-weight:600;color:var(--text-2)}
  .empty .t2{font-size:13px;color:var(--text-3);line-height:1.6;text-align:center}
  .empty .btn{margin-top:4px}

  /* 状态栏 */
  .statusbar{
    height:30px;display:flex;align-items:center;gap:16px;padding:0 14px;
    border-top:1px solid var(--border);background:var(--surface-2);
    font-size:11px;color:var(--text-3);flex:0 0 30px;letter-spacing:.02em;
  }
  .statusbar b{color:var(--text-2);font-weight:600}

  /* 弹层 */
  .overlay{position:absolute;inset:0;background:rgba(20,28,42,.30);display:flex;align-items:center;justify-content:center;z-index:10}
  .overlay.hidden{display:none}
  .modal{
    width:380px;background:var(--surface);border:1px solid var(--border-strong);
    border-radius:var(--r-lg);box-shadow:var(--shadow-pop);padding:16px 18px;
    display:flex;flex-direction:column;gap:13px;
  }
  .modal h3{font-size:14px;font-weight:600;letter-spacing:.01em}
  .field{display:flex;flex-direction:column;gap:5px}
  .field label{font-size:11.5px;color:var(--text-2);font-weight:600;letter-spacing:.03em}
  .field .row{display:flex;gap:7px;align-items:center}
  .field input[type=text]{
    flex:1;height:30px;border:1px solid var(--border-strong);border-radius:var(--r-md);
    padding:0 9px;font:inherit;font-size:12.5px;color:var(--text);background:#fff;outline:0;
  }
  .field input[type=text]:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
  .swatches{display:flex;gap:7px;align-items:center}
  .swatch{width:20px;height:14px;border-radius:3px;cursor:pointer;border:2px solid transparent;transition:transform .1s,border-color .1s}
  .swatch.on{border-color:var(--text)}
  .swatch:hover{transform:translateY(-1px)}
  .modal .actions{display:flex;justify-content:flex-end;gap:7px;margin-top:2px}

  /* toast（Fluent 通知式：浅色表面 + 描边，非黑色胶囊） */
  .toast{
    position:absolute;left:50%;bottom:42px;transform:translateX(-50%) translateY(6px);
    background:var(--surface);color:var(--text);font-size:12.5px;padding:8px 13px 8px 11px;
    border:1px solid var(--border-strong);border-radius:var(--r-md);box-shadow:var(--shadow-pop);
    opacity:0;transition:opacity .16s,transform .16s;pointer-events:none;z-index:20;
    max-width:80%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    display:flex;align-items:center;gap:7px;
  }
  .toast::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--accent);flex:0 0 auto}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  .hint{font-size:11.5px;color:var(--text-3);margin-top:12px;text-align:center;max-width:1000px;line-height:1.7}
  .hint code{background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:1px 5px;font-size:11px}

  /* 滚动条 */
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#c6ced9;border:3px solid transparent;background-clip:content-box;border-radius:8px}
  ::-webkit-scrollbar-thumb:hover{background:#aeb8c6;background-clip:content-box}
  ::-webkit-scrollbar-track{background:transparent}

  @media (prefers-reduced-motion: reduce){
    *{transition:none!important;animation:none!important}
  }
</style>
</head>
<body>

  <!-- SVG 图标雪碧图（Fluent 风格：文件夹实心黄 + 其余描边） -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-logo" viewBox="0 0 24 24">
        <path d="M4 3.5h4.6l2.1 2H20A1.5 1.5 0 0 1 21.5 7v12A1.5 1.5 0 0 1 20 20.5H4A1.5 1.5 0 0 1 2.5 19V5A1.5 1.5 0 0 1 4 3.5z" fill="#0067c0"/>

      </symbol>
      <symbol id="i-min" viewBox="0 0 12 12"><path d="M2.5 6h7" stroke="currentColor" stroke-width="1" stroke-linecap="round"/></symbol>
      <symbol id="i-max" viewBox="0 0 12 12"><rect x="3" y="3" width="6" height="6" rx="0.8" fill="none" stroke="currentColor" stroke-width="1"/></symbol>
      <symbol id="i-close" viewBox="0 0 12 12"><path d="M3 3l6 6M9 3l-6 6" stroke="currentColor" stroke-width="1" stroke-linecap="round"/></symbol>
    </defs>
  </svg>

  <!-- 演示控制 -->
  <div class="demo-bar">
    <span class="lbl">视觉稿</span>
    <button class="active" data-view="main">主窗口</button>
    <button data-view="empty">空状态</button>
    <button data-view="modal">添加书签</button>
    <span class="sep"></span>
    <button data-action="reset">重置</button>
  </div>

  <!-- 应用窗口 -->
  <div class="window">
    <div class="titlebar">
      <svg class="app-logo"><use href="#i-logo"/></svg>
      <span class="app-name">目录导航器</span>
      <div class="search">
        <svg class="s-ic"><use href="#i-search"/></svg>
        <input id="filter" placeholder="过滤当前列…" autocomplete="off">
        <span class="kbd">Ctrl F</span>
      </div>
      <button class="btn" id="openInExplorer">在资源管理器中打开</button>
      <div class="win-ctrl">
        <button><svg class="wc"><use href="#i-min"/></svg></button>
        <button><svg class="wc"><use href="#i-max"/></svg></button>
        <button class="close"><svg class="wc"><use href="#i-close"/></svg></button>
      </div>
    </div>

    <div class="body">
      <div class="sidebar">
        <div class="head">
          <span>书签</span>
          <button class="add" id="addBtn" title="添加书签"><svg><use href="#i-plus"/></svg></button>
        </div>
        <div class="bm-list" id="bmList"></div>
        <div class="foot"><span class="count" id="bmCount"></span></div>
      </div>

      <div class="main">
        <div class="breadcrumb" id="breadcrumb"></div>
        <div class="columns" id="columns"></div>
        <div class="empty hidden" id="emptyState">
          <svg class="big"><use href="#i-folder"/></svg>
          <div class="t1">还没有书签</div>
          <div class="t2">点击左上角「＋」，或粘贴一个路径即可开始</div>
          <button class="btn primary" id="emptyAdd">添加书签</button>
        </div>
      </div>
    </div>

    <div class="statusbar">
      <span><b id="stTotal">0</b> 项</span>
      <span id="stDetail"></span>
      <span style="margin-left:auto">点目录下钻 · 点文件打开 · 双击目录用资源管理器打开</span>
    </div>

    <div class="overlay hidden" id="overlay">
      <div class="modal">
        <h3>添加书签</h3>
        <div class="field">
          <label>路径</label>
          <div class="row">
            <input type="text" id="mPath" value="D:\Work\Projects\client-2024">

          </div>
        </div>
        <div class="field">
          <label>别名</label>
          <input type="text" id="mName" value="Work">
        </div>
        <div class="field">
          <label>颜色</label>
          <div class="swatches" id="swatches"></div>
        </div>
        <div class="actions">
          <button class="btn" id="mCancel">取消</button>
          <button class="btn primary" id="mSave">保存</button>
        </div>
      </div>
    </div>

    <div class="toast" id="toast"></div>
  </div>

  <div class="hint">点左侧书签切换锚点 · 点列内目录向右下钻 · 点面包屑回跳 · 双击目录 = 用资源管理器打开（模拟）</div>

      root: dir('下载', [
        dir('安装包', [file('uTools-8.0.exe'), file('node-v20.msi')]),
        file('报价单-2024.xlsx'), file('会议记录.docx'), file('截图-01.png')
      ])
    },
    { id:'a4', name:'截图', color:'#7a5cd6', pinned:false,
      path:['D:','Pictures','截图'],
      root: dir('截图', [
        file('2024-01-15.png'), file('2024-02-02.png'), file('2024-03-11.png'), file('2024-04-20.png')
      ])
    }
  ];

  let state = { anchorId:'a1', chain:[] };
  const colors = ['#0067c0','#c2395f','#2e9e5b','#d97706','#7a5cd6','#0e7490'];

  const $ = s => document.querySelector(s);
  const columnsEl = $('#columns'), breadcrumbEl = $('#breadcrumb'), bmListEl = $('#bmList');
  const anchor = () => anchors.find(a=>a.id===state.anchorId);
  const absSegments = () => anchor().path.concat(state.chain.map(n=>n.name));
  function columnLevels(){
    const a = anchor(); const levels = [a.root.children];
    for(let i=0;i<state.chain.length;i++) levels.push(state.chain[i].children);
    return levels;
  }

  function renderSidebar(){
    bmListEl.innerHTML = '';
    [...anchors].sort((x,y)=> Number(y.pinned)-Number(x.pinned)).forEach(a=>{
      const el = document.createElement('div');
      el.className = 'bm' + (a.id===state.anchorId?' active':'');
      el.setAttribute('role','option');
      el.innerHTML = `<span class="dot" style="background:${a.color}"></span>
        <span class="name">${a.name}</span>
        ${a.pinned?`<svg class="pin"><use href="#i-pin"/></svg>`:''}`;
      el.onclick = ()=>selectAnchor(a.id);
      el.ondblclick = ()=>toast(`已在资源管理器中打开：${a.path.join('\\')}`);
      bmListEl.appendChild(el);
    });
    $('#bmCount').textContent = anchors.length + ' 个书签';
  }
  function selectAnchor(id){ state.anchorId=id; state.chain=[]; renderAll(); }

  function renderBreadcrumb(){
    const a = anchor(); const segs = absSegments(); const ai = a.path.length-1;
    breadcrumbEl.innerHTML = '';
    segs.forEach((name,i)=>{
      if(i>0){
        const s = document.createElement('span'); s.className='crumb sep';
        s.innerHTML = `<svg><use href="#i-chev"/></svg>`;
        breadcrumbEl.appendChild(s);
      }
      const c = document.createElement('span');
      c.className = 'crumb' + (i===segs.length-1?' current':'') + (i===ai?' anchor':'');
      c.innerHTML = (i===0?`<svg class="c-ic"><use href="#i-drive"/></svg>`:'') + `<span>${name}</span>`;
      const depth = i-ai;
      c.onclick = ()=>{ state.chain = depth<0 ? [] : state.chain.slice(0,depth); renderAll(); };
      breadcrumbEl.appendChild(c);
    });
  }

  function renderColumns(){
    const levels = columnLevels(), a = anchor();
    columnsEl.innerHTML = '';
    levels.forEach((children,idx)=>{
      const col = document.createElement('div'); col.className='col';
      const label = idx===0 ? a.name : state.chain[idx-1].name;
      const head = document.createElement('div'); head.className='col-head';
      head.innerHTML = `<svg class="ch-ic"><use href="#i-folder"/></svg><span>${label}</span>`;
      col.appendChild(head);

      const items = document.createElement('div'); items.className='items';
      filterChildren(children).forEach(child=>{
        const it = document.createElement('div');
        it.className = 'item ' + (child.type==='file'?'file':'dir');
        it.tabIndex = 0;
        const ic = child.type==='dir' ? '#i-folder' : '#i-file';
        it.innerHTML = `<svg class="f-ic ${child.type}"><use href="${ic}"/></svg>
          <span class="f-name">${child.name}</span>
          ${child.type==='dir'?`<svg class="chev"><use href="#i-chev"/></svg>`:''}`;
        it.onclick = ()=>{
          if(child.type==='dir'){
            const k = state.chain.findIndex(n=>n===child);
            state.chain = k>=0 ? state.chain.slice(0,k+1) : state.chain.concat(child);
            renderAll();
          } else {
            clearSelected(); it.classList.add('selected');
            toast(`已打开：${absSegments().concat(child.name).join('\\')}`);
          }
        };
        it.ondblclick = ()=>{ if(child.type==='dir') toast(`已在资源管理器中打开：${absSegments().concat(child.name).join('\\')}`); };
        items.appendChild(it);
      });
      col.appendChild(items); columnsEl.appendChild(col);
    });

    if(columnsEl.scrollWidth > columnsEl.clientWidth){
      if(!columnsEl.querySelector('.fade-right')){
        const f = document.createElement('div'); f.className='fade-right'; columnsEl.appendChild(f);
      }
    }
    columnsEl.scrollLeft = columnsEl.scrollWidth;

    const cur = filterChildren(levels[levels.length-1]||[]);
    $('#stTotal').textContent = cur.length;
    $('#stDetail').textContent = `目录 ${cur.filter(c=>c.type==='dir').length} / 文件 ${cur.filter(c=>c.type==='file').length}`;
  }

  function clearSelected(){ columnsEl.querySelectorAll('.item.selected').forEach(e=>e.classList.remove('selected')); }
  function filterChildren(list){
    const q = $('#filter').value.trim().toLowerCase();
    return q ? list.filter(c=>c.name.toLowerCase().includes(q)) : list;
  }
  function renderAll(){ renderSidebar(); renderBreadcrumb(); renderColumns(); }

  let toastTimer;
  function toast(msg){
    const t = $('#toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.classList.remove('show'), 1800);
  }

  function setView(v){
    document.querySelectorAll('.demo-bar button[data-view]').forEach(b=>b.classList.toggle('active', b.dataset.view===v));
    const empty=$('#emptyState'), cols=$('#columns'), crumb=$('#breadcrumb');
    $('#overlay').classList.toggle('hidden', v!=='modal');
    if(v==='modal'){ empty.classList.add('hidden'); cols.style.display=''; crumb.style.display=''; return; }
    if(v==='empty'){ empty.classList.remove('hidden'); cols.style.display='none'; crumb.style.display='none'; }
    else { empty.classList.add('hidden'); cols.style.display=''; crumb.style.display=''; }
  }

  function renderPickers(){
    const sw = $('#swatches'); sw.innerHTML='';
    colors.forEach((c,i)=>{
      const d = document.createElement('div'); d.className='swatch'+(i===0?' on':'');
      d.style.background=c; d.onclick = ()=>{ sw.querySelectorAll('.swatch').forEach(x=>x.classList.remove('on')); d.classList.add('on'); };
      sw.appendChild(d);
    });
  }

  $('#filter').addEventListener('input', renderColumns);
  $('#addBtn').onclick = ()=>setView('modal');
  $('#emptyAdd').onclick = ()=>setView('modal');
  $('#mCancel').onclick = ()=>setView('main');
  $('#mSave').onclick = ()=>{
    const name = $('#mName').value.trim() || '新书签';
    const color = ($('#swatches .swatch.on')||{style:{background:colors[0]}}).style.background;
    anchors.push({ id:'a'+Date.now(), name, color, pinned:false,
      path:['C:','Users','you', name], root: dir(name,[file('示例文件.txt')]) });
    state = { anchorId: anchors[anchors.length-1].id, chain:[] };
    setView('main'); renderAll(); toast('已添加书签：'+name);
  };
  $('#openInExplorer').onclick = ()=>toast(`已在资源管理器中打开：${absSegments().join('\\')}`);

  document.querySelectorAll('.demo-bar button[data-view]').forEach(b=>b.onclick=()=>setView(b.dataset.view));
  document.querySelectorAll('.demo-bar button[data-action]').forEach(b=>{
    if(b.dataset.action==='reset') b.onclick = ()=>{ state={anchorId:'a1',chain:[]}; setView('main'); $('#filter').value=''; renderAll(); };
  });

  renderPickers(); renderAll();
})();
</script>
</body>
</html>
