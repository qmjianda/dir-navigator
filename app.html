<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>目录导航器</title>
<link rel="stylesheet" href="app.css">
</head>
<body>

  <!-- ===== SVG 图标雪碧图（Fluent 风格：文件夹实心黄 + 其余描边） ===== -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-logo" viewBox="0 0 24 24">
        <path d="M4 3.5h4.6l2.1 2H20A1.5 1.5 0 0 1 21.5 7v12A1.5 1.5 0 0 1 20 20.5H4A1.5 1.5 0 0 1 2.5 19V5A1.5 1.5 0 0 1 4 3.5z" fill="#0067c0"/>
        <path d="M2.5 9.5h19" stroke="#fff" stroke-width="1.3"/>
        <path d="M8.7 14.2l2 2 4.4-4.6" fill="none" stroke="#fff" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
      <symbol id="i-folder" viewBox="0 0 24 24">
        <path d="M3.5 7A2.5 2.5 0 0 1 6 4.5h3.6c.55 0 1.07.22 1.45.61l.85.89h6.6A2.5 2.5 0 0 1 21 8.5V18a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3.5 18V7z" fill="#ffd76e"/>
        <path d="M3.5 9.5h17V18a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3.5 18V9.5z" fill="#ffc238"/>
      </symbol>
      <symbol id="i-file" viewBox="0 0 24 24">
        <path d="M6.5 3.5h7.7L19 8.3V19a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 5 19V5A1.5 1.5 0 0 1 6.5 3.5z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
        <path d="M14.2 3.5V8.3H19" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
      </symbol>
      <symbol id="i-chev" viewBox="0 0 24 24">
        <path d="M9.5 6.5l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
      <symbol id="i-search" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="6.4" fill="none" stroke="currentColor" stroke-width="1.6"/>
        <path d="M15.8 15.8l4.4 4.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </symbol>
      <symbol id="i-drive" viewBox="0 0 24 24">
        <rect x="3" y="5" width="18" height="13.5" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.5"/>
        <path d="M3 14.5h18" stroke="currentColor" stroke-width="1.5"/>
        <circle cx="16" cy="11" r="1" fill="currentColor"/>
      </symbol>
      <symbol id="i-computer" viewBox="0 0 24 24">
        <rect x="4" y="5" width="16" height="11" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.5"/>
        <path d="M9 19h6M12 16v3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </symbol>
      <symbol id="i-plus" viewBox="0 0 24 24">
        <path d="M12 5.5v13M5.5 12h13" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
      </symbol>
      <symbol id="i-pin" viewBox="0 0 24 24">
        <path d="M9.5 4.5h5l-.9 5.2 2.9 2.9v1.9H7.5v-1.9l2.9-2.9-.9-5.2z" fill="currentColor"/>
        <path d="M12 14.5V20" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </symbol>
      <symbol id="i-edit" viewBox="0 0 24 24">
        <path d="M19.3 8.3l-3.6-3.6 1-1a1.5 1.5 0 0 1 2.1 0l1.5 1.5a1.5 1.5 0 0 1 0 2.1l-1 1z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
        <path d="M4.5 19.5l3.8-.9L19.7 7.2a1.5 1.5 0 0 0 0-2.1l-1.6-1.6a1.5 1.5 0 0 0-2.1 0L4.6 15.7l-.9 3.8z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
      </symbol>
      <symbol id="i-trash" viewBox="0 0 24 24">
        <path d="M5 6.5h14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M9 6.5V4.8A1.3 1.3 0 0 1 10.3 3.5h3.4A1.3 1.3 0 0 1 15 4.8v1.7" fill="none" stroke="currentColor" stroke-width="1.5"/>
        <path d="M6.5 6.5l.7 12.2A1.5 1.5 0 0 0 8.7 20h6.6a1.5 1.5 0 0 0 1.5-1.3l.7-12.2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
        <path d="M10 10v6M14 10v6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </symbol>
      <symbol id="i-copy" viewBox="0 0 24 24">
        <rect x="8" y="8" width="10.5" height="10.5" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.5"/>
        <path d="M5.5 15H5a1.5 1.5 0 0 1-1.5-1.5V5.5A1.5 1.5 0 0 1 5 4h8A1.5 1.5 0 0 1 14.5 5.5v.5" fill="none" stroke="currentColor" stroke-width="1.5"/>
      </symbol>
      <symbol id="i-open" viewBox="0 0 24 24">
        <path d="M13.5 6.5H6.5A2 2 0 0 0 4.5 8.5v9A2 2 0 0 0 6.5 19.5h9A2 2 0 0 0 17.5 17.5v-7" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M19.5 4.5h-5.5M19.5 4.5l-8 8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
      <symbol id="i-settings" viewBox="0 0 24 24">
        <path d="M4 7h7M15 7h5M4 17h3M11 17h9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        <circle cx="13" cy="7" r="2" fill="none" stroke="currentColor" stroke-width="1.5"/>
        <circle cx="9" cy="17" r="2" fill="none" stroke="currentColor" stroke-width="1.5"/>
      </symbol>
      <symbol id="i-up" viewBox="0 0 24 24">
        <path d="M5 14.5l7-7 7 7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
      <symbol id="i-close" viewBox="0 0 24 24">
        <path d="M6 6l12 12M18 6l-12 12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </symbol>
      <symbol id="i-check" viewBox="0 0 24 24">
        <path d="M5 12.5l4.3 4.3L19 7.1" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
    </defs>
  </svg>

  <div class="app">
    <!-- 工具栏 -->
    <header class="toolbar">
      <div class="brand">
        <svg class="brand-ic"><use href="#i-logo"/></svg>
        <span class="brand-name">目录导航器</span>
      </div>
      <div class="search">
        <svg class="s-ic"><use href="#i-search"/></svg>
        <input id="filter" placeholder="过滤当前列…" autocomplete="off" spellcheck="false">
        <span class="kbd">Ctrl F</span>
      </div>
      <div class="toolbar-actions">
        <button class="btn icon-btn" id="upBtn" title="向上一级 (←)"><svg class="b-ic"><use href="#i-up"/></svg></button>
        <button class="btn" id="openInExplorer"><svg class="b-ic"><use href="#i-open"/></svg>在资源管理器中打开</button>
        <button class="btn icon-btn" id="addCurrentBtn" title="把当前资源管理器目录添加为书签"><svg class="b-ic"><use href="#i-plus"/></svg></button>
        <button class="btn icon-btn" id="settingsBtn" title="设置"><svg class="b-ic"><use href="#i-settings"/></svg></button>
      </div>
    </header>

    <div class="body">
      <!-- 左侧书签栏 -->
      <aside class="sidebar">
        <div class="head">
          <span>书签</span>
          <button class="icon-btn" id="addBtn" title="添加书签"><svg class="h-ic"><use href="#i-plus"/></svg></button>
        </div>
        <div class="bm-list" id="bmList"></div>
        <div class="foot">
          <button class="foot-btn" id="thisPcBtn"><svg class="f-ic"><use href="#i-computer"/></svg><span>此电脑</span></button>
          <span class="count" id="bmCount"></span>
        </div>
      </aside>

      <!-- 主区 -->
      <main class="main">
        <div class="breadcrumb" id="breadcrumb"></div>
        <div class="columns-wrap">
          <div class="columns" id="columns"></div>
          <div class="empty hidden" id="emptyState">
            <svg class="big"><use href="#i-folder"/></svg>
            <div class="t1">还没有书签</div>
            <div class="t2">点击左上角「＋」添加常用目录，<br>或点底部「此电脑」浏览全部磁盘</div>
            <button class="btn primary" id="emptyAdd"><svg class="b-ic"><use href="#i-plus"/></svg>添加书签</button>
          </div>
        </div>
      </main>
    </div>

    <!-- 状态栏 -->
    <footer class="statusbar">
      <span id="stTotal"></span>
      <span id="stDetail"></span>
      <span class="hint">点目录下钻 · 点文件打开 · 双击目录在资源管理器打开 · 拖列边调宽 · 右键更多</span>
    </footer>
  </div>

  <!-- 右键菜单 -->
  <div class="ctxmenu hidden" id="ctxMenu"></div>

  <!-- 弹层：添加/编辑书签 + 设置 -->
  <div class="overlay hidden" id="overlay">
    <!-- 书签弹窗 -->
    <div class="modal hidden" id="bookmarkModal">
      <h3 id="bmTitle">添加书签</h3>
      <div class="field">
        <label for="bmPath">路径</label>
        <div class="row">
          <input type="text" id="bmPath" placeholder="例如 C:\Users\you\Work" spellcheck="false">
          <button class="btn" id="bmBrowse">浏览</button>
          <button class="btn icon-btn" id="bmCurrent" title="使用当前资源管理器目录"><svg class="b-ic"><use href="#i-drive"/></svg></button>
        </div>
        <div class="field-hint" id="bmPathHint"></div>
      </div>
      <div class="field">
        <label for="bmName">别名</label>
        <input type="text" id="bmName" placeholder="留空则使用目录名" spellcheck="false">
      </div>
      <div class="field">
        <label>颜色</label>
        <div class="swatches" id="swatches"></div>
      </div>
      <div class="actions">
        <button class="btn" id="bmCancel">取消</button>
        <button class="btn primary" id="bmSave">保存</button>
      </div>
    </div>

    <!-- 设置弹窗 -->
    <div class="modal hidden" id="settingsModal">
      <h3>设置</h3>
      <div class="setting-row">
        <div class="setting-label">显示文件</div>
        <label class="switch"><input type="checkbox" id="setShowFiles"><span class="track"></span></label>
      </div>
      <div class="setting-row">
        <div class="setting-label">显示隐藏项</div>
        <label class="switch"><input type="checkbox" id="setShowHidden"><span class="track"></span></label>
      </div>
      <div class="setting-row">
        <div class="setting-label">默认列宽 <span class="setting-val" id="setColWidthValue">212 px</span></div>
        <input type="range" id="setColWidth" min="160" max="280" step="4" value="212">
      </div>
      <div class="actions">
        <button class="btn" id="setCancel">取消</button>
        <button class="btn primary" id="setDone">完成</button>
      </div>
    </div>
  </div>

  <!-- toast -->
  <div class="toast" id="toast"></div>

<!-- 演示用桥接层：仅在浏览器直开（没有 uTools preload 提供 window.services）时生效 -->
<script src="demo-services.js"></script>
<script src="app.js"></script>
</body>
</html>
